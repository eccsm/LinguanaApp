# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Architectures included in Android builds.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Enable React Native's new architecture and Hermes.
newArchEnabled=true
hermesEnabled=true

# Improve compatibility between AdMob and other React Native libraries.
android.useFullClasspathForDexingTransform=true

# Use the supported JDK for Android builds on this workstation.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# Release signing credentials belong in android/gradle.properties.local
# (ignored by Git) or in Gradle/CI project properties.
